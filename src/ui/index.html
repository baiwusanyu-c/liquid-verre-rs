<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>液态玻璃 · 控制面板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #e0e0e0;
            padding: 20px;
            user-select: none;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #64b5f6;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 13px;
            color: #9e9e9e;
        }
        .section {
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #81c784;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before {
            content: "";
            width: 4px;
            height: 16px;
            background: #81c784;
            border-radius: 2px;
        }
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .input-field {
            flex: 1;
        }
        .input-field label {
            display: block;
            font-size: 12px;
            color: #b0b0b0;
            margin-bottom: 6px;
        }
        .input-field input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .input-field input:focus {
            outline: none;
            border-color: #64b5f6;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(100, 181, 246, 0.4);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef5350 0%, #e53935 100%);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 83, 80, 0.4);
        }
        .slider-group {
            margin-bottom: 16px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .slider-header label {
            font-size: 13px;
            color: #e0e0e0;
        }
        .slider-header .value {
            font-size: 12px;
            color: #64b5f6;
            font-weight: 600;
            min-width: 40px;
            text-align: right;
        }
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            transition: background 0.2s;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(100, 181, 246, 0.4);
            transition: transform 0.2s;
        }
        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        .slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(100, 181, 246, 0.4);
        }
        .tips {
            margin-top: 20px;
            padding: 12px;
            background: rgba(100, 181, 246, 0.1);
            border-left: 3px solid #64b5f6;
            border-radius: 0 8px 8px 0;
            font-size: 12px;
            color: #b0b0b0;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>液态玻璃 · 控制面板</h1>
        <p>背景由 WGC 实时采集；所有参数实时生效</p>
    </div>
    
    <div class="section">
        <div class="section-title">玻璃块管理</div>
        <div class="input-group">
            <div class="input-field">
                <label>宽度 (px)</label>
                <input type="number" id="width" value="600" min="24" max="8000">
            </div>
            <div class="input-field">
                <label>高度 (px)</label>
                <input type="number" id="height" value="400" min="24" max="8000">
            </div>
        </div>
        <div class="button-group">
            <button class="btn btn-primary" onclick="addBlock()">＋ 添加一块</button>
            <button class="btn btn-primary" onclick="add20Blocks()">＋ 添加 20 块</button>
            <button class="btn btn-secondary" onclick="removeBlock()">删除选中块</button>
            <button class="btn btn-danger" onclick="clearBlocks()">清空全部</button>
        </div>
    </div>
    
    <div class="section">
        <div class="section-title">折射与光学参数</div>
        <div id="sliders"></div>
    </div>
    
    <div class="tips">
        💡 拖动玻璃块任意位置可移动；拖右下角可缩放<br>
        ⌨️ 快捷键：+ 增一块，- 删一块，Esc 退出
    </div>
    
    <script>
        const params = [
            { key: 'radius', label: '圆角半径', min: 0, max: 96, default: 32, step: 1 },
            { key: 'lens_coverage', label: '透镜覆盖', min: 0, max: 0.5, default: 0.15, step: 0.01 },
            { key: 'ior', label: '折射率 IOR', min: 1, max: 1.7, default: 1.5, step: 0.01 },
            { key: 'thickness', label: '玻璃厚度', min: 0, max: 80, default: 26, step: 1 },
            { key: 'refr_strength', label: '折射强度', min: 0, max: 2, default: 1, step: 0.01 },
            { key: 'dispersion', label: '色散', min: 0, max: 1, default: 0.25, step: 0.01 },
            { key: 'clarity', label: '清晰度', min: 0, max: 1, default: 0.10, step: 0.01 },
            { key: 'blur_max', label: '模糊半径', min: 0, max: 40, default: 20, step: 1 },
            { key: 'spec_intensity', label: '高光强度', min: 0, max: 4, default: 0.85, step: 0.01 },
            { key: 'spec_power', label: '高光锐度', min: 1, max: 128, default: 42, step: 1 },
            { key: 'fresnel', label: 'Fresnel', min: 0, max: 0.25, default: 0.1, step: 0.005 },
            { key: 'caustic', label: '焦散增益', min: 0, max: 1.5, default: 0.5, step: 0.01 },
            { key: 'tint_opacity', label: '染色浓度', min: 0, max: 0.4, default: 0.018, step: 0.001 },
            { key: 'adaptive_tint', label: '自适应染色', min: 0, max: 1, default: 0.35, step: 0.01 },
            { key: 'mouse_intensity', label: '鼠标高光', min: 0, max: 2, default: 1.35, step: 0.01 },
            { key: 'mouse_radius', label: '鼠标半径', min: 40, max: 480, default: 220, step: 5 },
            { key: 'shadow_opacity', label: '阴影强度', min: 0, max: 0.5, default: 0.10, step: 0.01 },
        ];
        
        // 生成滑块
        const slidersContainer = document.getElementById('sliders');
        params.forEach(p => {
            const div = document.createElement('div');
            div.className = 'slider-group';
            div.innerHTML = `
                <div class="slider-header">
                    <label>${p.label}</label>
                    <span class="value" id="${p.key}-value">${p.default}</span>
                </div>
                <input type="range" class="slider" id="${p.key}" 
                       min="${p.min}" max="${p.max}" value="${p.default}" step="${p.step}">
            `;
            slidersContainer.appendChild(div);
            
            const slider = document.getElementById(p.key);
            const valueDisplay = document.getElementById(`${p.key}-value`);
            
            slider.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                valueDisplay.textContent = value;
                fetch('/api/param', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: p.key, value })
                });
            });
        });
        
        // 按钮功能
        function addBlock() {
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);
            fetch('/api/size', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ width, height })
            }).then(() => fetch('/api/add', { method: 'POST' }));
        }
        
        function add20Blocks() {
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);
            fetch('/api/size', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ width, height })
            }).then(() => fetch('/api/add20', { method: 'POST' }));
        }
        
        function removeBlock() {
            fetch('/api/remove', { method: 'POST' });
        }
        
        function clearBlocks() {
            fetch('/api/clear', { method: 'POST' });
        }
        
        // 尺寸输入实时更新
        document.getElementById('width').addEventListener('input', (e) => {
            const width = parseFloat(e.target.value);
            const height = parseFloat(document.getElementById('height').value);
            fetch('/api/size', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ width, height })
            });
        });
        
        document.getElementById('height').addEventListener('input', (e) => {
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(e.target.value);
            fetch('/api/size', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ width, height })
            });
        });
        
        // 加载当前参数
        fetch('/api/params')
            .then(r => r.json())
            .then(data => {
                Object.entries(data).forEach(([key, value]) => {
                    const slider = document.getElementById(key);
                    const display = document.getElementById(`${key}-value`);
                    if (slider && display) {
                        slider.value = value;
                        display.textContent = Number(value).toFixed(slider.step < 1 ? 2 : 0);
                    }
                    if (key === 'new_width' || key === 'new_height') {
                        const input = document.getElementById(key === 'new_width' ? 'width' : 'height');
                        if (input) input.value = value;
                    }
                });
            });
    </script>
</body>
</html>
