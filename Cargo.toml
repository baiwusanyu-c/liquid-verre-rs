# liquid-verre-rs —— Cargo workspace
#
# 三个成员：
#   crates/liquid-verre  库本体（package 名 liquid-verre-rs，lib 名 liquid_verre）
#   playground           dev 控制面板（不属于库的业务代码，仅用于开发期调参）
#   xtask                构建 / 检查 / 打包 / 性能阀门（`cargo xtask <cmd>`）
#
# profile 与重构前逐字一致：性能阀门（tools/gate_perf.py）的历史数字是在这套
# profile 下测出来的，改任何一个字段都会让新旧指标不可比。

[workspace]
resolver = "2"
members = ["crates/liquid-verre", "playground", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
windows = { version = "0.58", features = [
  # Win32
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # WinRT / WGC
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
log = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
