# 打 tag（v*）或手动触发时：构建 release 产物、挂到 GitHub Release、
# 并在配置了 CARGO_REGISTRY_TOKEN secret 时发布到 crates.io。
#
# 触发方式：
#   git tag v0.4.1 && git push origin v0.4.1
# 或 GitHub 页面 Actions -> "release" -> Run workflow（可填 tag 名）。
#
# crates.io 发布需要的 secret（在仓库 Settings -> Secrets and variables -> Actions 添加）：
#   CARGO_REGISTRY_TOKEN   # crates.io 的 API token；不配置则只出 GitHub Release，不发布 crate
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.4.1）；留空则只构建不发布"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: build + package (windows)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
      - name: gate (fmt + clippy + test)
        run: node scripts/check.mjs
      - name: package (dist/ + zip)
        run: node scripts/package.mjs
      - id: meta
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' -List).Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - uses: actions/upload-artifact@v4
        with:
          name: liquid-verre-rs-dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: liquid-verre-rs-dist
          path: dist/
      - name: release notes from CHANGELOG
        id: notes
        run: |
          V="${{ needs.package.outputs.version }}"
          awk -v v="## [$V]" 'index($0, v) == 1 {flag=1; next} /^## \[/ {if (flag) exit} flag {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "（本 tag 无 CHANGELOG 条目，见提交历史）" > notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          name: liquid-verre-rs ${{ needs.package.outputs.version }}
          body_path: notes.md
          draft: false
          prerelease: ${{ contains(needs.package.outputs.version, '-') }}
          files: |
            dist/*.zip
            dist/*/build-info.json

  crates-io:
    name: publish to crates.io
    needs: [package, github-release]
    runs-on: ubuntu-latest
    # 没配 token 就跳过：只出 GitHub Release 也是完全可用的分发方式（git 依赖）
    if: ${{ secrets.CARGO_REGISTRY_TOKEN != '' && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --package liquid-verre-rs --no-verify
