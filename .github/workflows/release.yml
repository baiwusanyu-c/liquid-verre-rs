# 打 tag（v*）或手动触发时：构建 release 产物、挂到 GitHub Release、
# 并在配置了 CARGO_REGISTRY_TOKEN secret 时发布到 crates.io。
#
# 触发方式：
#   git tag v0.4.1 && git push origin v0.4.1
# 或 GitHub 页面 Actions -> "release" -> Run workflow（可填 tag 名）。
#
# crates.io 发布需要的 secret（在仓库 Settings -> Secrets and variables -> Actions 添加）：
#   CARGO_REGISTRY_TOKEN   # crates.io 的 API token；不配置则只出 GitHub Release，不发布 crate
# 想免掉长期 token，可改用 crates.io 的 trusted publishing（GitHub Actions OIDC）：
#   给下面的 crates-io job 加 `permissions: id-token: write`，并把 publish 换成
#   `cargo publish --package liquid-verre-rs --no-verify --trusted-publishing=always`
#   （需要较新的 stable cargo；且 crate 必须已经手工首发过一次，配置步骤见 README「发布与分发」）
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.4.1）；留空则只构建不发布"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: build + package (windows)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
      - name: gate (fmt + clippy + test)
        run: node scripts/check.mjs
      - name: package (dist/ + zip)
        run: node scripts/package.mjs
      - id: meta
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' -List).Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - uses: actions/upload-artifact@v4
        with:
          name: liquid-verre-rs-dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: liquid-verre-rs-dist
          path: dist/
      - name: release notes from CHANGELOG
        id: notes
        run: |
          V="${{ needs.package.outputs.version }}"
          awk -v v="## [$V]" 'index($0, v) == 1 {flag=1; next} /^## \[/ {if (flag) exit} flag {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "（本 tag 无 CHANGELOG 条目，见提交历史）" > notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          name: liquid-verre-rs ${{ needs.package.outputs.version }}
          body_path: notes.md
          draft: false
          prerelease: ${{ contains(needs.package.outputs.version, '-') }}
          files: |
            dist/*.zip
            dist/*/build-info.json

  crates-io:
    name: publish to crates.io
    needs: [package, github-release]
    runs-on: ubuntu-latest
    # ⚠ `secrets` 上下文在 job 级 `if:` 里**不可用**（GitHub 官方安全指南：
    # "Secrets cannot be directly referenced in if: conditionals"）。写成
    # `if: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}` 不会按预期放行，结果是
    # 配了 token 也静默不发布。所以 job 只按 ref 过滤，token 有无在 step 里用 env 判。
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != '' }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: has token?
        id: gate
        run: |
          if [ -n "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 secret CARGO_REGISTRY_TOKEN，跳过 crates.io 发布（GitHub Release 与 git 依赖不受影响）"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.publish == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.publish == 'true'
      - name: publish
        if: steps.gate.outputs.publish == 'true'
        run: cargo publish --package liquid-verre-rs --no-verify
