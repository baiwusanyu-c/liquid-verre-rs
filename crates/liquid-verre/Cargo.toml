[package]
name = "liquid-verre-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows 桌面玻璃窗口组件库：液态玻璃（WGC/DDA 采集 + D3D11 模糊金字塔 + DirectComposition 合成 + Snell 折射）与透明玻璃两种模式"
build = "build.rs"
# cargo package 要求 readme 在 crate 目录内（workspace 根的 README 不会被打进 .crate），
# 因此 crate 自带一份短 README，完整文档在仓库根。
readme = "README.md"
# 仓库地址：缺了 cargo package 会告警，crates.io 页面也靠它给出「源码」链接。
# ⚠ 仓库名（tarui-glass）与 crate 名（liquid-verre-rs）不一致；任一边改名都要同步这里 + README 的 git 依赖片段。
repository = "https://github.com/baiwusanyu-c/tarui-glass"
keywords = ["windows", "glass", "liquid-glass", "d3d11", "directcomposition"]
categories = ["graphics", "os::windows-apis"]

[lib]
name = "liquid_verre"
path = "src/lib.rs"

[dependencies]
windows = { workspace = true }
serde = { workspace = true }
log = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
